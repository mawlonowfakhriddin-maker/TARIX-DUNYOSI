<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hayvonlar Kitobi 📚</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Nunito',sans-serif;min-height:100vh;background:#0d2b0d;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow-x:hidden;}

/* ========== HOME ========== */
#home-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;width:100%;padding:30px 20px;}
.home-title{color:#f5e6c8;font-size:2.8em;font-weight:900;text-align:center;text-shadow:0 4px 15px rgba(0,0,0,.6);margin-bottom:8px;animation:popIn .8s cubic-bezier(.17,.67,.3,1.4) forwards;}
.home-sub{color:#a8d5a2;font-size:1.1em;margin-bottom:50px;text-align:center;animation:fadeIn 1s .3s both;}
@keyframes popIn{0%{opacity:0;transform:scale(.5) translateY(30px)}100%{opacity:1;transform:scale(1) translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.home-cards{display:flex;gap:30px;flex-wrap:wrap;justify-content:center;}
.home-card{background:linear-gradient(145deg,#1e5c1e,#2e8c2e);border-radius:24px;padding:36px 44px;text-align:center;cursor:pointer;border:3px solid #4abe4a;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:transform .3s,box-shadow .3s;animation:fadeIn .8s .5s both;min-width:230px;}
.home-card:last-child{animation-delay:.7s;}
.home-card:hover{transform:translateY(-10px) scale(1.04);box-shadow:0 20px 45px rgba(0,0,0,.6);}
.home-card-icon{font-size:4.5em;display:block;margin-bottom:12px;animation:floatIcon 3s ease-in-out infinite;}
.home-card:last-child .home-card-icon{animation-delay:1.5s;}
@keyframes floatIcon{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(3deg)}}
.home-card h2{color:#f5e6c8;font-size:1.4em;font-weight:900;}
.home-card p{color:#c8f0c8;font-size:.9em;margin-top:6px;}

/* ========== LIST ========== */
#list-screen{display:none;flex-direction:column;align-items:center;min-height:100vh;width:100%;padding:20px;}
.list-header{display:flex;align-items:center;gap:14px;margin-bottom:28px;width:100%;max-width:920px;}
.btn-back{background:#2e7c2e;color:#f5e6c8;border:none;border-radius:14px;padding:11px 22px;font-size:1em;font-family:inherit;font-weight:700;cursor:pointer;transition:background .2s,transform .2s;}
.btn-back:hover{background:#4abe4a;transform:scale(1.05);}
.list-title{color:#f5e6c8;font-size:1.9em;font-weight:900;}
.animals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px;width:100%;max-width:920px;}
.animal-btn{background:linear-gradient(145deg,#1a4a1a,#2a6a2a);border:2px solid #4aaf4a;border-radius:18px;padding:18px 10px;text-align:center;cursor:pointer;color:#f5e6c8;font-family:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s,background .2s;}
.animal-btn:hover{transform:translateY(-6px) scale(1.06);box-shadow:0 12px 28px rgba(0,0,0,.45);background:linear-gradient(145deg,#2a6a2a,#4abe4a);}
.btn-num{font-size:.72em;color:#8ece8e;display:block;margin-bottom:4px;}
.btn-emoji{font-size:2.6em;display:block;margin-bottom:6px;}
.btn-name{font-size:.95em;}

/* ========== ANIMAL SCREEN ========== */
#animal-screen{display:none;flex-direction:column;align-items:center;width:100%;min-height:100vh;padding:16px 12px;justify-content:center;}

/* INTRO ANIMATION OVERLAY */
#intro-overlay{position:fixed;inset:0;background:#0d2b0d;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;pointer-events:none;}
#intro-overlay.hidden{display:none;}
#intro-emoji{font-size:10em;animation:introAnimal 1.2s ease forwards;}
#intro-name{color:#f5e6c8;font-size:2em;font-weight:900;margin-top:10px;animation:introName .8s .4s both;}
#intro-flash{position:absolute;inset:0;background:white;animation:flash .4s .9s forwards;opacity:0;}
@keyframes introAnimal{0%{transform:scale(0) rotate(-20deg);opacity:0}60%{transform:scale(1.3) rotate(5deg);opacity:1}80%{transform:scale(.95) rotate(-2deg)}100%{transform:scale(1.1) rotate(0);opacity:1}}
@keyframes introName{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes flash{0%{opacity:0}30%{opacity:.7}100%{opacity:0}}

/* CARD */
.animal-card{width:100%;max-width:780px;background:linear-gradient(160deg,#fdf8ee,#f5e8cc);border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.55),-4px 0 0 #7a4a10,4px 0 0 rgba(0,0,0,.2);overflow:hidden;position:relative;}
/* spine line */
.animal-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:16px;background:linear-gradient(180deg,#8B4513,#A0522D,#8B4513);box-shadow:inset -2px 0 6px rgba(0,0,0,.4);}

/* HABITAT BANNER */
.habitat-banner{width:100%;height:170px;position:relative;overflow:hidden;margin-left:16px;width:calc(100% - 16px);}
.habitat-banner svg{width:100%;height:100%;}
/* habitat label */
.habitat-label{position:absolute;bottom:10px;left:14px;background:rgba(0,0,0,.55);color:white;font-size:.8em;font-weight:700;padding:4px 12px;border-radius:20px;backdrop-filter:blur(4px);}

/* ANIMAL HERO */
.hero-section{display:flex;align-items:flex-start;gap:0;padding:0 20px 0 28px;}
/* left column: big emoji + sound */
.hero-left{display:flex;flex-direction:column;align-items:center;min-width:140px;padding-top:14px;}
.hero-emoji-wrap{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center;}
.hero-emoji{font-size:5em;display:block;cursor:pointer;user-select:none;}
.shadow-el{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);width:70px;height:10px;background:radial-gradient(ellipse,rgba(0,0,0,.2),transparent);border-radius:50%;}
/* sound waves */
.sw{position:absolute;border:2.5px solid rgba(60,160,60,.6);border-radius:50%;animation:sw .9s ease-out infinite;opacity:0;top:50%;left:50%;transform:translate(-50%,-50%);}
.sw:nth-child(1){width:60px;height:60px;}
.sw:nth-child(2){width:60px;height:60px;animation-delay:.3s;}
.sw:nth-child(3){width:60px;height:60px;animation-delay:.6s;}
@keyframes sw{0%{width:40px;height:40px;opacity:.8;transform:translate(-50%,-50%)}100%{width:110px;height:110px;opacity:0;transform:translate(-50%,-50%)}}
.sounding .sw{opacity:1;}

.sound-btn{margin-top:10px;background:linear-gradient(135deg,#2a7a2a,#4abe4a);border:none;border-radius:50px;padding:7px 16px;color:#fff;font-family:inherit;font-size:.8em;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:transform .2s,box-shadow .2s;box-shadow:0 3px 10px rgba(0,0,0,.2);}
.sound-btn:hover{transform:scale(1.08);}
.sound-btn.on{background:linear-gradient(135deg,#8a4400,#d47000);animation:sbPulse .4s ease-in-out infinite;}
@keyframes sbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* right column: name + info */
.hero-right{flex:1;padding:14px 0 14px 16px;}
.hero-name{font-size:2em;font-weight:900;color:#2a1000;line-height:1.1;}
.hero-latin{font-size:.82em;color:#8a6a3a;font-style:italic;margin-bottom:8px;}
.hero-badge{display:inline-block;padding:3px 13px;border-radius:20px;font-size:.78em;font-weight:700;color:#fff;margin-bottom:12px;}
.bg-green{background:#1e7a1e;}
.bg-red{background:#8a1a1a;}

/* INFO GRID */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px 0 28px;margin-top:4px;}
.info-cell{background:rgba(160,100,30,.1);border-radius:12px;padding:9px 12px;border-left:3px solid #c8933c;}
.ic-label{font-size:.68em;color:#8a6a3a;font-weight:700;text-transform:uppercase;letter-spacing:.8px;display:flex;align-items:center;gap:4px;margin-bottom:3px;}
.ic-val{font-size:.85em;color:#2a1000;font-weight:600;line-height:1.35;}

/* FOOD ICONS STRIP */
.food-strip{display:flex;gap:8px;padding:12px 20px 4px 28px;flex-wrap:wrap;align-items:center;}
.food-strip-label{font-size:.75em;color:#8a6a3a;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-right:4px;}
.food-chip{background:rgba(60,160,60,.15);border:1.5px solid rgba(60,160,60,.4);border-radius:20px;padding:4px 10px;font-size:.85em;color:#1a4a1a;font-weight:700;display:flex;align-items:center;gap:4px;}

/* FACT */
.fact-box{margin:10px 20px 16px 28px;background:linear-gradient(135deg,rgba(200,147,60,.18),rgba(200,147,60,.08));border-radius:14px;padding:10px 14px;border-left:4px solid #c8933c;}
.fact-label{font-size:.68em;color:#8a6a3a;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px;}
.fact-val{font-size:.88em;color:#2a1000;font-weight:600;line-height:1.4;}

/* PAGE NUMS */
.page-nums{display:flex;justify-content:space-between;padding:4px 20px 10px 28px;}
.pg{font-size:.72em;color:#a08050;}

/* NAV */
.book-nav{display:flex;gap:10px;margin-top:14px;width:100%;max-width:780px;justify-content:center;}
.nav-btn{background:linear-gradient(135deg,#5a2a05,#8a4a15);color:#f5d078;border:none;border-radius:14px;padding:12px 26px;font-size:1em;font-family:inherit;font-weight:700;cursor:pointer;transition:transform .2s,background .2s;flex:1;max-width:170px;}
.nav-btn:hover:not(:disabled){transform:scale(1.06);background:linear-gradient(135deg,#8a4a15,#b06020);}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.btn-list{background:#1e5c1e;color:#f5e6c8;border:none;border-radius:14px;padding:12px 20px;font-size:1em;font-family:inherit;font-weight:700;cursor:pointer;transition:transform .2s,background .2s;}
.btn-list:hover{background:#2e8c2e;transform:scale(1.05);}

/* PER-ANIMAL ANIMATIONS */
.anim-graze .hero-emoji{animation:graze 2.8s ease-in-out infinite;}
@keyframes graze{0%,100%{transform:rotate(0) translateY(0)}35%{transform:rotate(-10deg) translateY(6px)}65%{transform:rotate(6deg) translateY(4px)}}
.anim-gallop .hero-emoji{animation:gallop .55s ease-in-out infinite;}
@keyframes gallop{0%,100%{transform:translateX(0) translateY(0) rotate(-2deg)}25%{transform:translateX(10px) translateY(-12px) rotate(4deg)}75%{transform:translateX(-8px) translateY(-6px) rotate(-6deg)}}
.anim-leap .hero-emoji{animation:leap .75s ease-in-out infinite;}
@keyframes leap{0%,100%{transform:translateY(0) scaleX(1)}40%{transform:translateY(-20px) scaleX(1.12)}70%{transform:translateY(-8px) scaleX(.95)}}
.anim-roar .hero-emoji{animation:roar 1s ease-in-out infinite;}
@keyframes roar{0%,100%{transform:scale(1) rotate(0)}40%{transform:scale(1.3) rotate(-6deg)}70%{transform:scale(1.1) rotate(5deg)}}
.anim-pounce .hero-emoji{animation:pounce .65s ease-in-out infinite;}
@keyframes pounce{0%,100%{transform:translateX(0) skewX(0)}30%{transform:translateX(14px) skewX(-10deg)}70%{transform:translateX(-10px) skewX(7deg)}}
.anim-fly .hero-emoji{animation:flyA 1.5s ease-in-out infinite;}
@keyframes flyA{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.anim-swim .hero-emoji{animation:swimA 1.3s ease-in-out infinite;}
@keyframes swimA{0%,100%{transform:translateX(0) rotate(0)}30%{transform:translateX(12px) rotate(10deg)}70%{transform:translateX(-10px) rotate(-10deg)}}
.anim-stalk .hero-emoji{animation:stalk 2s ease-in-out infinite;}
@keyframes stalk{0%,100%{transform:translateX(0) translateY(0) scaleY(1)}50%{transform:translateX(12px) translateY(-5px) scaleY(.95)}}
.anim-sway .hero-emoji{animation:sway 2.2s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-8px)}}

/* page-flip transition */
.page-flip{animation:pFlip .5s ease !important;}
@keyframes pFlip{0%{transform:scale(1) rotateY(0);opacity:1}45%{transform:scale(.93) rotateY(14deg);opacity:.4}100%{transform:scale(1) rotateY(0);opacity:1}}

@media(max-width:620px){
  .hero-section{flex-direction:column;align-items:center;}
  .hero-left{padding-top:10px;}
  .hero-right{padding:10px 0 0 0;text-align:center;width:100%;}
  .info-grid{grid-template-columns:1fr;}
  .hero-name{font-size:1.6em;}
  .habitat-banner{height:130px;}
  .home-title{font-size:2em;}
}
</style>
</head>
<body>

<!-- INTRO OVERLAY -->
<div id="intro-overlay" class="hidden">
  <div id="intro-emoji"></div>
  <div id="intro-name"></div>
  <div id="intro-flash"></div>
</div>

<!-- HOME -->
<div id="home-screen">
  <div class="home-title">📚 Hayvonlar Kitobi</div>
  <div class="home-sub">Tabiat sirlarini kashf et — har sahifada yangi dunyo!</div>
  <div class="home-cards">
    <div class="home-card" onclick="showList('green')">
      <span class="home-card-icon">🌿</span>
      <h2>O'txo'r Hayvonlar</h2>
      <p>10 ta hayvon · O't, barg, meva</p>
    </div>
    <div class="home-card" onclick="showList('red')">
      <span class="home-card-icon">🥩</span>
      <h2>Go'shtxo'r Hayvonlar</h2>
      <p>10 ta hayvon · Ovchilar dunyosi</p>
    </div>
  </div>
</div>

<!-- LIST -->
<div id="list-screen">
  <div class="list-header">
    <button class="btn-back" onclick="showHome()">← Orqaga</button>
    <div class="list-title" id="list-title"></div>
  </div>
  <div class="animals-grid" id="animals-grid"></div>
</div>

<!-- ANIMAL SCREEN -->
<div id="animal-screen">
  <div class="animal-card" id="book">
    <!-- habitat SVG -->
    <div class="habitat-banner" id="habitat-banner"></div>

    <!-- hero -->
    <div class="hero-section">
      <div class="hero-left">
        <div class="hero-emoji-wrap" id="emoji-wrap">
          <div class="sw"></div><div class="sw"></div><div class="sw"></div>
          <span class="hero-emoji" id="hero-emoji" onclick="playSound()"></span>
          <div class="shadow-el"></div>
        </div>
        <button class="sound-btn" id="sound-btn" onclick="playSound()">🔊 Ovoz</button>
      </div>
      <div class="hero-right">
        <div class="hero-name" id="hero-name"></div>
        <div class="hero-latin" id="hero-latin"></div>
        <span class="hero-badge" id="hero-badge"></span>
        <!-- drink inline -->
        <div style="font-size:.8em;color:#5a3a10;font-weight:700;display:flex;align-items:center;gap:5px;">
          <span>💧</span><span id="drink-val"></span>
        </div>
      </div>
    </div>

    <!-- food strip -->
    <div class="food-strip" id="food-strip"></div>

    <!-- info grid -->
    <div class="info-grid">
      <div class="info-cell">
        <div class="ic-label">🌍 Yashash joyi</div>
        <div class="ic-val" id="ic-habitat"></div>
      </div>
      <div class="info-cell">
        <div class="ic-label">📏 Og'irligi</div>
        <div class="ic-val" id="ic-weight"></div>
      </div>
      <div class="info-cell">
        <div class="ic-label">🌡️ Iqlim</div>
        <div class="ic-val" id="ic-climate"></div>
      </div>
      <div class="info-cell">
        <div class="ic-label">👨‍👩‍👧 Qancha yashaydi</div>
        <div class="ic-val" id="ic-life"></div>
      </div>
    </div>

    <!-- fact -->
    <div class="fact-box">
      <div class="fact-label">⚡ Qiziqarli ma'lumot</div>
      <div class="fact-val" id="fact-val"></div>
    </div>

    <div class="page-nums"><span class="pg" id="pg-l"></span><span class="pg" id="pg-r"></span></div>
  </div>

  <div class="book-nav">
    <button class="nav-btn" id="prev-btn" onclick="changePage(-1)">◀ Oldingi</button>
    <button class="btn-list" onclick="backToList()">📋 Ro'yxat</button>
    <button class="nav-btn" id="next-btn" onclick="changePage(1)">Keyingi ▶</button>
  </div>
</div>

<script>
// ============================================================
// ANIMAL DATA
// ============================================================
const animals = {
  green: [
    {
      name:"Sigir", emoji:"🐄", latin:"Bos taurus", anim:"graze",
      badge:"🌿 O'txo'r", badgeClass:"bg-green",
      weight:"400–900 kg", climate:"Mo'tadil, issiq", life:"15–20 yil",
      habitat:"Ferma va yaylovlarda — butun dunyo bo'ylab tarqalgan",
      food:[{e:"🌿",l:"O't"},{e:"🌾",l:"Beda"},{e:"🥕",l:"Sabzi"},{e:"🌽",l:"Don"}],
      drink:"Kuniga 100–150 litr suv",
      fact:"Sigir bir kunda 8 soat o't chaynaydi — ovqatni 50-70 marta qayta chaynaydii!",
      scene:`<svg viewBox="0 0 780 170" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#87CEEB"/><stop offset="55%" stop-color="#aae87a"/><stop offset="100%" stop-color="#5a9e3a"/></linearGradient></defs>
        <rect width="780" height="170" fill="url(#sg)"/>

        <rect x="0" y="125" width="780" height="45" fill="#4a8a2a"/>
        <rect x="30" y="98" width="5" height="30" fill="#8B6914"/>
        <rect x="130" y="98" width="5" height="30" fill="#8B6914"/>
        <rect x="230" y="98" width="5" height="30" fill="#8B6914"/>

      </svg>`,
      sceneLabel:"🌾 Ferma · Yaylov"
    },
    {
      name:"Qo'y", emoji:"🐑", latin:"Ovis aries", anim:"graze",
      badge:"🌿 O'txo'r", badgeClass:"bg-green",
      weight:"40–130 kg", climate:"Mo'tadil, sovuq", life:"10–12 yil",
      habitat:"Tog' va tekisliklarda, fermalarida — sovuq iqlimga chidamli",
      food:[{e:"🌿",l:"O't"},{e:"🌾",l:"Beda"},{e:"🌱",l:"Pichan"},{e:"🌽",l:"Don"}],
      drink:"Kuniga 2–10 litr suv",
      fact:"Qo'yning ko'zi 270° ko'radi — deyarli orqasini ham ko'radi!",
      scene:`<svg viewBox="0 0 780 170" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="qg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B0E2FF"/><stop offset="45%" stop-color="#aae87a"/><stop offset="100%" stop-color="#4a8e2a"/></linearGradient></defs>
        <rect width="780" height="170" fill="url(#qg)"/>
        <polygon points="0,110 90,45 180,110" fill="#8aaa7a" opacity=".55"/>
        <polygon points="140,110 250,30 360,110" fill="#7a9a6a" opacity=".55"/>
        <polygon points="400,110 530,20 660,110" fill="#6a8a5a" opacity=".55"/>
        <ellipse cx="100" cy="35" rx="60" ry="24" fill="white" opacity=".9"/>
        <ellipse cx="500" cy="25" rx="50" ry="20" fill="white" opacity=".8"/>

        <rect x="0" y="118" width="780" height="52" fill="#5aae3a"/>

      </svg>`,
      sceneLabel:"⛰️ Tog' · Yaylov"
    },
    {
      name:"Echki", emoji:"🐐", latin:"Capra hircus", anim:"leap",
      badge:"🌿 O'txo'r", badgeClass:"bg-green",
      weight:"20–80 kg", climate:"Tog'li, quruq", life:"10–15 yil",
      habitat:"Tog'lik joylarda va fermalarida — qoya-toshlarda yuradi",
      food:[{e:"🌿",l:"O't"},{e:"🍃",l:"Barg"},{e:"🌳",l:"Buta"},{e:"🍎",l:"Meva"}],
      drink:"Kuniga 2–8 litr suv",
      fact:"Echki ko'zining qorachig'i to'rtburchak shaklida — 320° ko'radi!",
      scene:`<svg viewBox="0 0 780 170" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B0C4DE"/><stop offset="60%" stop-color="#8a9aaa"/><stop offset="100%" stop-color="#5a6a5a"/></linearGradient></defs>
        <rect width="780" height="170" fill="url(#eg)"/>
        <polygon points="0,170 120,55 240,170" fill="#778899"/>

// ============================================================
// STATE
// ============================================================
let currentCategory = 'green';
let currentIndex = 0;
let currentList = [];
let audioCtx = null;
let isSoundPlaying = false;

// ============================================================
// NAV
// ============================================================
function showHome(){
  document.getElementById('home-screen').style.display='flex';
  document.getElementById('list-screen').style.display='none';
  document.getElementById('animal-screen').style.display='none';
}
function showList(cat){
  currentCategory=cat; currentList=animals[cat];
  document.getElementById('home-screen').style.display='none';
  document.getElementById('list-screen').style.display='flex';
  document.getElementById('animal-screen').style.display='none';
  document.getElementById('list-title').textContent = cat==='green'?"🌿 O'txo'r Hayvonlar":"🥩 Go'shtxo'r Hayvonlar";
  const grid=document.getElementById('animals-grid'); grid.innerHTML='';
  currentList.forEach((a,i)=>{
    const b=document.createElement('button'); b.className='animal-btn';
    b.innerHTML=`<span class="btn-num">${i+1}-raqam</span><span class="btn-emoji">${a.emoji}</span><span class="btn-name">${a.name}</span>`;
    b.onclick=()=>openAnimal(i); grid.appendChild(b);
  });
}
function openAnimal(idx){
  currentIndex=idx;
  document.getElementById('list-screen').style.display='none';
  document.getElementById('animal-screen').style.display='none';
  playIntro(idx);
}
function backToList(){
  document.getElementById('animal-screen').style.display='none';
  document.getElementById('list-screen').style.display='flex';
}
function changePage(dir){
  const n=currentIndex+dir;
  if(n>=0&&n<currentList.length){ currentIndex=n; renderAnimal(true); }
}

// ============================================================
// INTRO ANIMATION
// ============================================================
function playIntro(idx){
  const a=currentList[idx];
  const ov=document.getElementById('intro-overlay');
  document.getElementById('intro-emoji').textContent=a.emoji;
  document.getElementById('intro-name').textContent=a.name;
  ov.classList.remove('hidden');
  ov.style.pointerEvents='all';
  setTimeout(()=>{
    ov.classList.add('hidden');
    ov.style.pointerEvents='none';
    document.getElementById('animal-screen').style.display='flex';
    renderAnimal(false);
  },1300);
}

// ============================================================
// RENDER
// ============================================================
function renderAnimal(flip){
  const a=currentList[currentIndex];
  const book=document.getElementById('book');
  if(flip){ book.classList.remove('page-flip'); void book.offsetWidth; book.classList.add('page-flip'); }

  // habitat
  const hb=document.getElementById('habitat-banner');
  hb.innerHTML=a.scene+`<div class="habitat-label">${a.sceneLabel}</div>`;

  // emoji + anim
  const wrap=document.getElementById('emoji-wrap');
  const em=document.getElementById('hero-emoji');
  em.textContent=a.emoji;
  // remove all anim classes
  wrap.className='hero-emoji-wrap';
  if(a.anim) wrap.classList.add('anim-'+a.anim);
  wrap.classList.remove('sounding');

  document.getElementById('hero-name').textContent=a.name;
  document.getElementById('hero-latin').textContent=a.latin;
  const badge=document.getElementById('hero-badge');
  badge.textContent=a.badge; badge.className='hero-badge '+a.badgeClass;
  document.getElementById('drink-val').textContent=a.drink;

  // food strip
  const fs=document.getElementById('food-strip');
  fs.innerHTML=`<span class="food-strip-label">🍽️ Ovqat:</span>`+
    a.food.map(f=>`<span class="food-chip">${f.e} ${f.l}</span>`).join('');

  document.getElementById('ic-habitat').textContent=a.habitat;
  document.getElementById('ic-weight').textContent=a.weight;
  document.getElementById('ic-climate').textContent=a.climate;
  document.getElementById('ic-life').textContent=a.life;
  document.getElementById('fact-val').textContent=a.fact;

  const pg=currentIndex*2+1;
  document.getElementById('pg-l').textContent=pg;
  document.getElementById('pg-r').textContent=pg+1;

  document.getElementById('prev-btn').disabled=currentIndex===0;
  document.getElementById('next-btn').disabled=currentIndex===currentList.length-1;

  isSoundPlaying=false;
  const sb=document.getElementById('sound-btn');
  sb.classList.remove('on'); sb.textContent='🔊 Ovoz';
}

// ============================================================
// SOUND ENGINE
// ============================================================
function getCtx(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }

function playSound(){
  if(isSoundPlaying) return;
  const a=currentList[currentIndex];
  const ctx=getCtx();
  isSoundPlaying=true;
  const sb=document.getElementById('sound-btn');
  const wrap=document.getElementById('emoji-wrap');
  sb.classList.add('on'); sb.textContent='🔊 Jaranglayapti...';
  wrap.classList.add('sounding');
  const sounds={
    'Sigir':playMoo,'Qo\'y':playBaa,'Echki':playGoat,'Ot':playHorse,'Quyon':playRabbit,
    'Fil':playElephant,'Jirafa':playGiraffe,'Tuya':playCamel,'Kiyik':playDeer,'Zebra':playZebra,
    'Sher':()=>playRoar(ctx,55),"Yo'lbars":()=>playRoar(ctx,70),"Bo'ri":playWolf,'Tulki':playFox,
    'Qoplon':()=>playRoar(ctx,90),'Gepard':playCheetah,'Sirtlon':playHyena,'Timsoh':playCroc,
    'Burgut':playEagle,'Akula':playShark
  };
  const fn=sounds[a.name]; if(fn) fn(ctx);
  setTimeout(()=>{
    isSoundPlaying=false;
    sb.classList.remove('on'); sb.textContent='🔊 Ovoz';
    wrap.classList.remove('sounding');
  },2300);
}

function playMoo(ctx){ const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(); o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(90,t);o.frequency.linearRampToValueAtTime(70,t+.3);o.frequency.linearRampToValueAtTime(80,t+.9);o.frequency.linearRampToValueAtTime(60,t+1.6);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.42,t+.1);g.gain.linearRampToValueAtTime(.36,t+1.3);g.gain.linearRampToValueAtTime(0,t+2.1);o.start(t);o.stop(t+2.1); }
function playBaa(ctx){ const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(),lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.connect(lg);lg.connect(o.frequency);o.connect(g);g.connect(ctx.destination);o.type='sawtooth';lfo.type='sine';lfo.frequency.value=8;lg.gain.value=18;o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(240,t+.9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.05);g.gain.linearRampToValueAtTime(.26,t+.8);g.gain.linearRampToValueAtTime(0,t+1.6);lfo.start(t);lfo.stop(t+1.6);o.start(t);o.stop(t+1.6); }
function playGoat(ctx){ for(let i=0;i<2;i++){const t=ctx.currentTime+i*.65,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(360+i*20,t);o.frequency.linearRampToValueAtTime(300,t+.42);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.05);g.gain.linearRampToValueAtTime(0,t+.52);o.start(t);o.stop(t+.6);} }
function playHorse(ctx){ const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(400,t);o.frequency.linearRampToValueAtTime(900,t+.3);o.frequency.linearRampToValueAtTime(600,t+.6);o.frequency.linearRampToValueAtTime(300,t+1.1);o.frequency.linearRampToValueAtTime(180,t+1.6);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.45,t+.05);g.gain.linearRampToValueAtTime(.38,t+1.1);g.gain.linearRampToValueAtTime(0,t+2.1);o.start(t);o.stop(t+2.1); }
function playRabbit(ctx){ for(let i=0;i<4;i++){const t=ctx.currentTime+i*.32,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(80,t);o.frequency.linearRampToValueAtTime(50,t+.12);g.gain.setValueAtTime(.28,t);g.gain.linearRampToValueAtTime(0,t+.16);o.start(t);o.stop(t+.18);} }
function playElephant(ctx){ const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(600,t+.4);o.frequency.linearRampToValueAtTime(800,t+.7);o.frequency.linearRampToValueAtTime(300,t+1.3);o.frequency.linearRampToValueAtTime(100,t+1.9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55,t+.1);g.gain.linearRampToValueAtTime(.45,t+1.1);g.gain.linearRampToValueAtTime(0,t+2.2);o.start(t);o.stop(t+2.2); }
function playGiraffe(ctx){ const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(55,t);o.frequency.linearRampToValueAtTime(80,t+1.1);o.frequency.linearRampToValueAtTime(60,t+2.1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.3);g.gain.linearRampToValueAtTime(.26,t+1.6);g.gain.linearRampToValueAtTime(0,t+2.2);o.start(t);o.stop(t+2.2); }
function playCamel(ctx){ const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(120,t);o.frequency.linearRampToValueAtTime(80,t+.6);o.frequency.linearRampToValueAtTime(100,t+1.1);o.frequency.linearRampToValueAtTime(70,t+1.9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.38,t+.1);g.gain.linearRampToValueAtTime(.32,t+1.3);g.gain.linearRampToValueAtTime(0,t+2.2);o.start(t);o.stop(t+2.2); }
function playDeer(ctx){ const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.setValueAtTime(300,t);o.frequency.linearRampToValueAtTime(500,t+.5);o.frequency.linearRampToValueAtTime(400,t+1.1);o.frequency.linearRampToValueAtTime(240,t+1.9);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.42,t+.1);g.gain.linearRampToValueAtTime(.36,t+1.3);g.gain.linearRampToValueAtTime(0,t+2.2);o.start(t);o.stop(t+2.2); }
function playZebra(ctx){ for(let i=0;i<3;i++){const t=ctx.currentTime+i*.52,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(400,t);o.frequency.linearRampToValueAtTime(200,t+.32);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.38,t+.05);g.gain.linearRampToValueAtTime(0,t+.42);o.start(t);o.stop(t+.52);} }
function playRoar(ctx,b){ const t=ctx.currentTime,o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain();o.connect(g);o2.connect(g2);g.connect(ctx.destination);g2.connect(ctx.destination);o.type='sawtooth';o2.type='square';o.frequency.setValueAtTime(b,t);o.frequency.linearRampToValueAtTime(b*2.6,t+.3);o.frequency.linearRampToValueAtTime(b*1.6,t+.9);o.frequency.linearRampToValueAtTime(b*.85,t+1.6);o.frequency.linearRampToValueAtTime(b*.5,t+2.1);o2.frequency.setValueAtTime(b*.5,t);o2.frequency.linearRampToValueAtTime(b*.3,t+2.1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55,t+.1);g.gain.linearRampToValueAtTime(.45,t+1.6);g.gain.linearRampToValueAtTime(0,t+2.3);g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(.22,t+.1);g2.gain.linearRampToValueAtTime(0,t+2.3);o.start(t);o.stop(t+2.3);o2.start(t);o2.stop(t+2.3); }
function playWolf(ctx){ const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(200,t);o.frequency.linearRampToValueAtTime(600,t+.5);o.frequency.linearRampToValueAtTime(800,t+1.1);o.frequency.linearRampToValueAtTime(700,t+1.5);o.frequency.linearRampToValueAtTime(380,t+2.1);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.45,t+.1);g.gain.linearRampToValueAtTime(.38,t+1.6);g.gain.linearRampToValueAtTime(0,t+2.3);o.start(t);o.stop(t+2.3); }
function playFox(ctx){ for(let i=0;i<3;i++){const t=ctx.currentTime+i*.52,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(600,t);o.frequency.linearRampToValueAtTime(300,t+.32);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.05);g.gain.linearRampToValueAtTime(0,t+.42);o.start(t);o.stop(t+.52);} }
function playCheetah(ctx){ for(let i=0;i<4;i++){const t=ctx.currentTime+i*.38,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.setValueAtTime(820-i*55,t);o.frequency.linearRampToValueAtTime(620,t+.28);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.05);g.gain.linearRampToValueAtTime(0,t+.32);o.start(t);o.stop(t+.38);} }
function playHyena(ctx){ [500,620,460,720,410].forEach((f,i)=>{const t=ctx.currentTime+i*.32,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*.7,t+.22);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.32,t+.05);g.gain.linearRampToValueAtTime(0,t+.26);o.start(t);o.stop(t+.32);}); }
function playCroc(ctx){ const t=ctx.currentTime,n=ctx.createOscillator(),ng=ctx.createGain(),f=ctx.createBiquadFilter();n.connect(f);f.connect(ng);ng.connect(ctx.destination);n.type='sawtooth';n.frequency.value=100;f.type='bandpass';f.frequency.value=2000;f.Q.value=.5;ng.gain.setValueAtTime(0,t);ng.gain.linearRampToValueAtTime(.55,t+.1);ng.gain.linearRampToValueAtTime(.45,t+.9);ng.gain.linearRampToValueAtTime(0,t+1.6);n.start(t);n.stop(t+1.6);const th=ctx.createOscillator(),tg=ctx.createGain();th.connect(tg);tg.connect(ctx.destination);th.type='sine';th.frequency.setValueAtTime(60,t+1.7);th.frequency.linearRampToValueAtTime(28,t+2.2);tg.gain.setValueAtTime(0,t+1.7);tg.gain.linearRampToValueAtTime(.55,t+1.75);tg.gain.linearRampToValueAtTime(0,t+2.2);th.start(t+1.7);th.stop(t+2.2); }
function playEagle(ctx){ const t=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();o.connect(f);f.connect(g);g.connect(ctx.destination);o.type='sawtooth';f.type='bandpass';f.frequency.value=3000;f.Q.value=2.2;o.frequency.setValueAtTime(1200,t);o.frequency.linearRampToValueAtTime(1850,t+.22);o.frequency.linearRampToValueAtTime(900,t+.55);o.frequency.linearRampToValueAtTime(1450,t+.88);o.frequency.linearRampToValueAtTime(620,t+1.6);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.45,t+.05);g.gain.linearRampToValueAtTime(.36,t+1.3);g.gain.linearRampToValueAtTime(0,t+2.1);o.start(t);o.stop(t+2.1); }
function playShark(ctx){ for(let i=0;i<3;i++){const t=ctx.currentTime+i*.55,o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(40+i*5,t);o.frequency.linearRampToValueAtTime(24,t+.46);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.55,t+.05);g.gain.linearRampToValueAtTime(0,t+.48);o.start(t);o.stop(t+.52);} }
